<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbf9">
  <meta name="robots" content="noindex,follow">
  <title>Página no encontrada | Rider Market</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 0;
    }
    .not-found-inner { max-width: 620px; }
    .not-found-code {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--celeste-strong);
      margin-bottom: 18px;
    }
    .not-found h1 { font-size: clamp(52px, 10vw, 96px); margin-bottom: 20px; }
    .not-found p {
      max-width: 42ch;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
      margin-bottom: 30px;
    }
    .not-found-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="container not-found-inner">
      <p class="not-found-code">Error 404</p>
      <h1>Esta página<br>no está en <em>el mapa</em>.</h1>
      <p>El enlace que seguiste no existe o cambió de lugar. Volvé al inicio para recorrer servicios, productos y galería.</p>
      <div class="not-found-actions">
        <a class="btn btn--dark" href="./">Volver al inicio</a>
        <a class="btn btn--ghost" href="./#productos">Ver productos</a>
      </div>
    </div>
  </main>
</body>
</html>
